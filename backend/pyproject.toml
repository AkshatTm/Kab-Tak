[project]
name = "backend"
version = "0.1.0"
description = "Kab Tak backend"
authors = [
    { name = "AkshatTm", email = "12340akshat12340@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
markers = ["live: hits real network/LLM"]
addopts = '-m "not live"'
testpaths = ["tests"]
pythonpath = ["."]
