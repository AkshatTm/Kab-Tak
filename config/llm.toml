# LLM provider chain (ADR 0002). Order is fixed: Groq -> Cerebras -> Gemini.
timeout_s = 8
deadline_s = 12

[[providers]]
# verified 2026-11-25: https://console.groq.com/docs/models, /docs/openai
name = "groq"
base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-20b"
key_env = "GROQ_API_KEY"

[[providers]]
# verified 2026-11-25: https://inference-docs.cerebras.ai/models/overview, /capabilities/structured-outputs
name = "cerebras"
base_url = "https://api.cerebras.ai/v1"
model = "gpt-oss-120b"
key_env = "CEREBRAS_API_KEY"

[[providers]]
# verified 2026-11-25: https://aistudio.google.com/docs/openai, /docs/models
# json_object on this endpoint is not confirmed by the docs: check it in the live eval.
name = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
model = "gemini-3.5-flash-lite"
key_env = "GEMINI_API_KEY"
